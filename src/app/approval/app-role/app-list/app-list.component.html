<!-- app-list.component.html -->

<div class="app-list-container">

  <!-- Header -->
  <div class="page-header">
    <mat-icon color="primary">security</mat-icon>
    <div>
      <h2>Application Roles</h2>
      <p>Manage system roles and access</p>
    </div>
  </div>

  <!-- Loading -->
  <div class="loading" *ngIf="loading">
    <mat-progress-spinner diameter="36" mode="indeterminate"></mat-progress-spinner>
  </div>

  <!-- Error -->
  <div class="error" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <button
  mat-raised-button
  color="primary"
  class="btn-create"
  [routerLink]="['/travel/app/create']">
  <mat-icon>add</mat-icon>
  New Request
</button>

  <!-- Table -->
  <div class="table-wrapper" *ngIf="!loading && roles.length">

    <table mat-table [dataSource]="roles" class="bank-table">

      <!-- ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let row">
          {{ row.applicationRoleId }}
        </td>
      </ng-container>

      <!-- Name -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Role Name </th>
        <td mat-cell *matCellDef="let row" class="role-name">
          {{ row.name }}
        </td>
      </ng-container>

      <!-- Created -->
      <ng-container matColumnDef="created">
        <th mat-header-cell *matHeaderCellDef> Created </th>
        <td mat-cell *matCellDef="let row">
          {{ row.dateCreated | date:'mediumDate' }}
        </td>
      </ng-container>

      <!-- Updated -->
      <ng-container matColumnDef="updated">
        <th mat-header-cell *matHeaderCellDef> Last Updated </th>
        <td mat-cell *matCellDef="let row">
          {{ row.lastUpdated | date:'mediumDate' }}
        </td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-header">
          Actions
        </th>
        <td mat-cell *matCellDef="let row" class="actions-cell">

          <button
            mat-icon-button
            color="primary"
            matTooltip="View details"
            (click)="viewDetails(row.applicationRoleId)">
            <mat-icon>visibility</mat-icon>
          </button>

          <!-- <button
            mat-icon-button
            color="accent"
            matTooltip="Edit role"
            (click)="editRole(row.applicationRoleId)">
            <mat-icon>edit</mat-icon>
          </button> -->

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
  </div>
</div>
