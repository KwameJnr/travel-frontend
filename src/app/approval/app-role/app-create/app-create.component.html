<div class="create-wrapper">

  <mat-card class="create-card">
    <mat-card-title>
      <mat-icon color="primary">add</mat-icon>
      Create New Applicaation Role
    </mat-card-title>

    <mat-card-content>
      <!-- Success -->
      <div class="success" *ngIf="successMessage">{{ successMessage }}</div>
      <!-- Error -->
      <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <form [formGroup]="roleForm" (ngSubmit)="submit()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Role Name</mat-label>
          <input matInput formControlName="name" placeholder="Enter role name" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Permissions</mat-label>
          <input matInput formControlName="permissions" placeholder="Enter permissions" />
        </mat-form-field>

        <div class="actions">
          <button mat-stroked-button class="fnb-btn" color="warn" type="button" (click)="cancel()">
            <mat-icon>arrow_back</mat-icon>
            Cancel
          </button>

          <button mat-raised-button class="fnb-btn" color="primary" type="submit" [disabled]="loading">
            <mat-icon>save</mat-icon>
            Save
            <mat-progress-spinner
              *ngIf="loading"
              mode="indeterminate"
              diameter="20"
              class="spinner">
            </mat-progress-spinner>
          </button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>

</div>
