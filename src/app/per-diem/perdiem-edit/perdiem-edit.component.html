<div *ngIf="loading" class="loading-container">
  <mat-spinner diameter="56"></mat-spinner>
</div>

<div *ngIf="!loading" class="edit-wrapper">

  <!-- Header -->
  <div class="page-header">
    <div class="title-group">
      <mat-icon color="primary">edit</mat-icon>
      <div>
        <h2>Edit Per-Diem</h2>
        <p class="subtitle">Update per-diem financial configuration</p>
      </div>
    </div>

    <button mat-stroked-button color="primary" (click)="onCancel()">
      <mat-icon>arrow_back</mat-icon>
      Back
    </button>
  </div>

  <!-- Form Card -->
  <mat-card class="form-card">
    <mat-card-title>Per-Diem Details</mat-card-title>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-grid">

        <mat-form-field appearance="outline">
          <mat-label>Daily Rate (USD)</mat-label>
          <input matInput type="number" formControlName="dollarRate">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Airfare Cost</mat-label>
          <input matInput type="number" formControlName="airFareCost">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Accommodation Cost</mat-label>
          <input matInput type="number" formControlName="accommodationCost">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Visa Application Fee</mat-label>
          <input matInput type="number" formControlName="visaApplicationCost">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Transportation Cost</mat-label>
          <input matInput type="number" formControlName="transportationCost">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Other Cost</mat-label>
          <input matInput type="number" formControlName="otherCost">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Country</mat-label>
          <input matInput formControlName="country">
        </mat-form-field>

      </div>

      <!-- Actions -->
      <div class="actions">
        <button mat-stroked-button type="button" (click)="onCancel()">Cancel</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
          Save Changes
        </button>
      </div>
    </form>
  </mat-card>
</div>
