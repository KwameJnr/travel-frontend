<mat-card class="confirmation-card">
    <mat-card-header>
      <mat-card-title>
        <mat-icon color="primary" style="vertical-align: middle; margin-right: 8px;">check_circle</mat-icon>
        Confirm Per-Diem Request
      </mat-card-title>
    </mat-card-header>
  
    <mat-card-content class="confirm-scroll-content">
      <div class="confirm-grid">
        <!-- Personal Info -->
        <ng-container *ngFor="let field of [
          { icon: 'money', label: 'Rate', value: data.rate },
          { icon: 'location_on', label: 'Location', value: data.location },
          { icon: 'date_range', label: 'Effective Date', value: data.effectiveDate | date: 'shortDate' },
          { icon: 'badge', label: 'Status', value: data.status },
        ]">
          <div class="field-row">
            <div class="field-label">
              <mat-icon class="field-icon" color="primary">{{ field.icon }}</mat-icon>
              {{ field.label }}
            </div>
            <div class="field-value">{{ field.value || '-' }}</div>
          </div>
        </ng-container>
      </div>
    </mat-card-content>
  
   <!-- Fixed action bar -->
  <mat-card-actions class="confirm-actions" align="end">
    <button mat-stroked-button color="warn" (click)="onCancel()">Edit</button>
    <button mat-raised-button color="primary" (click)="onConfirm()">Confirm</button>
  </mat-card-actions>
</mat-card>
