<mat-card>
    <mat-card-title>Per-Diem List</mat-card-title>
  
    <!-- Flex Container for Table & Chart -->
    <div class="layout-container">
      <!-- Travel Table Section -->
      <div class="travel-table-section">
        <!-- Loader -->
        <div *ngIf="loading" class="loading-spinner">
          <mat-spinner diameter="40"></mat-spinner>
        </div>
  
        <!-- Travel List Section -->
        <div *ngIf="!loading">
          <button mat-raised-button class="btn-add" color="primary" routerLink="/travel/perdiem/create">
            <mat-icon>add</mat-icon> New Request
          </button>
  
          <table mat-table [dataSource]="perdiem" class="mat-elevation-z2" *ngIf="perdiem.length > 0">
  
            <!-- Rate -->
            <ng-container matColumnDef="dollarRate">
              <th mat-header-cell *matHeaderCellDef> $ Rate </th>
              <td mat-cell *matCellDef="let perdiem"> {{ perdiem.dollarRate }} </td>
            </ng-container>
  
            <!-- Country -->
            <ng-container matColumnDef="country">
              <th mat-header-cell *matHeaderCellDef> Country </th>
              <td mat-cell *matCellDef="let perdiem"> {{ perdiem.country }} </td>
            </ng-container>
  
            <!-- Date -->
            <ng-container matColumnDef="airFareCost">
              <th mat-header-cell *matHeaderCellDef> Air Fare Cost </th>
              <td mat-cell *matCellDef="let perdiem"> {{ perdiem.airFareCost }} </td>
            </ng-container>
  
            <!-- Actions -->
            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef> Actions </th>
              <td mat-cell *matCellDef="let row">
                <button mat-icon-button color="accent" [routerLink]="['/travel/perdiem/detail', row.perDiemId]">
                  <mat-icon>visibility</mat-icon>
                </button>
                <button mat-icon-button color="primary"
                  [routerLink]="['/travel/perdiem/edit', row.perDiemId]">
                  <mat-icon>edit</mat-icon>
                </button>
              </td>
            </ng-container>
  
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
  
          <p *ngIf="perdiem.length === 0">No per-diem list found.</p>
        </div>
      </div>
  
    </div>
  </mat-card>
