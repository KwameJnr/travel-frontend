<form [formGroup]="perdiemForm" (ngSubmit)="onSubmit()" class="buhead-form">
    <mat-card class="buhead-card">
      <mat-card-title>
        <mat-icon color="primary" style="vertical-align: middle; margin-right: 8px;">business</mat-icon>
        Create Per-Diem Request /
      </mat-card-title>
  
      <mat-card-content>
        <div class="form-grid">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>$ Rate</mat-label>
            <input matInput formControlName="rate" required>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Airfare Cost</mat-label>
            <input matInput formControlName="airfareCost" >
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Accommodation Cost</mat-label>
            <input matInput formControlName="AccommodationCost" >
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Visa Application Fee</mat-label>
            <input matInput formControlName="visaApplicationFee" >
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Transportation Cost</mat-label>
            <input matInput formControlName="transportationCost" >
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Other Cost</mat-label>
            <input matInput formControlName="otherCost" >
          </mat-form-field>

          <mat-form-field appearance="fill">
            <mat-label>Status</mat-label>
            <mat-select formControlName="status">
              <mat-option [value]="'Active'">Active</mat-option>
              <mat-option [value]="'Inactive'">Inactive</mat-option>
            </mat-select>
          </mat-form-field>   

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Location</mat-label>
            <input matInput formControlName="location" required>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>CFO Email</mat-label>
            <input matInput formControlName="cfoEmail" required>
          </mat-form-field>

          <!-- <mat-form-field appearance="outline" class="full-width">
            <mat-label>Effective Date</mat-label>
            <input matInput formControlName="effectiveDate" required>
          </mat-form-field> -->

          <mat-form-field class="full-width" appearance="fill">
            <mat-label>Effective Date</mat-label>
            <input matInput [matDatepicker]="startPicker" formControlName="effectiveDate">
            <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
            <mat-datepicker #startPicker></mat-datepicker>
          </mat-form-field>

          <!-- <mat-form-field appearance="outline" class="full-width">
            <mat-label>Created By</mat-label>
            <input matInput formControlName="createdBy" type="email" required>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Edited By</mat-label>
            <input matInput formControlName="editedBy" type="email" required>
          </mat-form-field> -->
  
        </div>
      </mat-card-content>
  
      <mat-card-actions class="form-actions">
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="loading || perdiemForm.invalid"
        >
          <mat-progress-spinner
            *ngIf="loading"
            mode="indeterminate"
            diameter="20"
            strokeWidth="3"
            color="accent"
            class="spinner"
          ></mat-progress-spinner>
          <span *ngIf="!loading">Submit</span>
        </button>
  
        <button
          mat-stroked-button
          color="warn"
          type="button"
          (click)="onCancel()"
        >
          Cancel
        </button>
      </mat-card-actions>
    </mat-card>
  </form>
