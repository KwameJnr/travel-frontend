<div class="unauthorized-page">
  <mat-card class="unauthorized-card" fxLayout="column" fxLayoutAlign="center center">
    <div class="icon-wrapper">
      <mat-icon color="warn" class="warning-icon">lock</mat-icon>
    </div>

    <mat-card-title class="card-title">
      Access Denied
    </mat-card-title>

    <mat-card-content>
      <p class="message">
        Sorry, you do not have permission to access this page.
      </p>
      <p class="sub-message">
        If you think this is an error, please contact your administrator.
      </p>
    </mat-card-content>

    <mat-card-actions class="card-actions">
      <button mat-raised-button class="btn-bck" color="primary" (click)="goHome()">
        <mat-icon>arrow_back</mat-icon>
        Go Back to Dashboard
      </button>
    </mat-card-actions>
  </mat-card>
</div>
