<mat-card class="confirmation-card">
    <mat-card-header>
      <mat-card-title>
        <mat-icon color="primary" style="vertical-align: middle; margin-right: 8px;">check_circle</mat-icon>
        Confirm Business Head Request
      </mat-card-title>
    </mat-card-header>
  
    <mat-card-content class="confirm-scroll-content">
      <div class="confirm-grid">
        <!-- Personal Info -->
        <ng-container *ngFor="let field of [
          { icon: 'person', label: 'Employee Name', value: data.buHeadName },
          { icon: 'email', label: 'Email', value: data.buHeadEmail },
          { icon: 'badge', label: 'F-Number', value: data.fNumber },
          { icon: 'apartment', label: 'Department', value: data.Department },
        ]">
          <div class="field-row">
            <div class="field-label">
              <mat-icon class="field-icon" color="primary">{{ field.icon }}</mat-icon>
              {{ field.label }}
            </div>
            <div class="field-value">{{ field.value || '-' }}</div>
          </div>
        </ng-container>
